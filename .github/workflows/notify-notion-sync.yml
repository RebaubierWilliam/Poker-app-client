# Gabarit à déployer dans CHAQUE repo suivi (via `just deploy-triggers`).
#
# Ne fait rien d'autre que prévenir le repo de sync qu'une issue a bougé. Tout
# le travail reste centralisé là-bas : ce fichier n'a donc jamais besoin d'être
# mis à jour, même si la logique de synchro change.
name: Notifier la sync Notion

on:
  issues:
    # Tous les types qui changent une valeur affichée sur le kanban. `edited`
    # couvre le titre et le corps ; `milestoned`/`demilestoned` le jalon.
    types:
      - opened
      - edited
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - deleted
      - transferred

  pull_request:
    # `synchronize` = nouveaux commits poussés : change le volume et relance la
    # CI, donc deux colonnes du tableau. `ready_for_review` et
    # `converted_to_draft` font entrer et sortir de la colonne Brouillon.
    types:
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - review_requested
      - review_request_removed

  # Une revue soumise change reviewDecision, donc la colonne : c'est
  # précisément ce qui fait sortir une PR de « En attente de revue ».
  pull_request_review:
    types: [submitted, edited, dismissed]

# Rien à lire dans ce repo : le job ne fait qu'un appel sortant.
permissions: {}

# Une rafale d'étiquetages ne doit pas lancer dix synchros. On garde la
# dernière : la synchro étant un rapprochement complet, seule la plus récente
# a de la valeur.
concurrency:
  group: notify-notion-sync
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher la sync
        env:
          # PAT et non GITHUB_TOKEN : le token par défaut ne peut pas déclencher
          # un workflow dans un AUTRE repo.
          GH_TOKEN: ${{ secrets.NOTION_SYNC_DISPATCH_TOKEN }}
        run: |
          # `issue` n'existe que sur les événements d'issue, `pull_request` que
          # sur ceux de PR : on prend celui qui est renseigné. Le payload est
          # purement informatif — la synchro rapproche tout le compte de toute
          # façon, elle ne se sert pas de ce numéro.
          gh api repos/${{ github.repository_owner }}/notion-github-sync/dispatches \
            -f event_type=issue-changed \
            -f 'client_payload[repo]=${{ github.repository }}' \
            -f 'client_payload[event]=${{ github.event_name }}' \
            -f 'client_payload[number]=${{ github.event.issue.number || github.event.pull_request.number }}'
